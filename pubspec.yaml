name: chili_debug_view
description: Flutter debug view for checking network logs, response time and sharing them outside of app
homepage: https://github.com/ChiliLabs/chili_debug_view
version: 2.0.0

topics:
  - debug
  - dio
  - network
  - logs

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_ui: ^1.1.6
  dio: ^5.11.1
  material_ui: ^1.10.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
